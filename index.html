<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="商品ページ用HTMLをパーツから組み立てる静的ジェネレーター">
  <title>商品ページ HTMLジェネレーター</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --line: #dbe1ea;
      --paper: #ffffff;
      --wash: #f4f6fa;
      --navy: #17345f;
      --navy-2: #244b80;
      --cyan: #11a6a6;
      --cyan-soft: #e7f8f7;
      --danger: #b42318;
      --shadow: 0 10px 32px rgba(23, 52, 95, .08);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--wash);
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 12px clamp(18px, 3vw, 40px);
      color: #fff;
      background: var(--navy);
      box-shadow: 0 4px 20px rgba(12, 31, 58, .2);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: 10px;
      background: var(--cyan);
      font-weight: 800;
      letter-spacing: -.05em;
    }
    .brand h1 { margin: 0; font-size: 1.05rem; line-height: 1.2; }
    .brand small { display: block; margin-top: 3px; color: #cdd9eb; font-size: .78rem; font-weight: 500; }
    .top-actions { display: flex; gap: 8px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr);
      gap: 18px;
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 20px;
      align-items: start;
    }
    .panel {
      min-width: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 1rem; }
    .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: .78rem; }
    .palette { grid-column: 1 / -1; overflow: hidden; }
    .palette-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 14px; }
    .part-add {
      display: grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      text-align: left;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      transition: .18s ease;
    }
    .part-add:hover, .part-add:focus-visible { border-color: var(--cyan); background: var(--cyan-soft); transform: translateY(-1px); }
    .part-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: var(--navy);
      background: #eaf0f8;
      font-weight: 800;
    }
    .part-add strong { display: block; font-size: .86rem; }
    .part-add small { display: block; color: var(--muted); font-size: .7rem; }
    .rule-note { margin: 0 14px 14px; padding: 12px; color: #37536f; background: #edf6ff; border-radius: 10px; font-size: .76rem; }
    .composer { overflow: hidden; }
    .composer-toolbar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .parts { display: grid; gap: 12px; padding: 14px; }
    .empty {
      padding: 38px 18px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed #b9c5d6;
      border-radius: 12px;
      background: #fafbfc;
    }
    .empty strong { display: block; margin-bottom: 6px; color: var(--ink); }
    .part-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
    .part-card.dragging { opacity: .48; }
    .part-card.drag-over { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .part-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
    }
    .drag-handle { display: inline-flex; align-items: center; min-height: 32px; padding: 0 4px; color: #98a2b3; font-size: 1.15rem; user-select: none; cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .part-title { flex: 1; font-size: .9rem; font-weight: 700; }
    .number { color: var(--muted); font-size: .75rem; }
    .status-badge { flex: 0 0 auto; padding: 3px 8px; border-radius: 999px; font-size: .7rem; font-weight: 800; }
    .status-badge.on { color: #067647; background: #e8f7ef; }
    .status-badge.off { color: #b42318; background: #fff0ee; }
    .icon-btn {
      display: grid;
      place-items: center;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      color: #475467;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
    }
    .icon-btn:hover, .icon-btn:focus-visible { color: var(--navy); background: #eaf0f8; }
    .icon-btn.delete:hover { color: var(--danger); background: #fff0ee; }
    .part-body { display: grid; gap: 12px; padding: 14px; }
    .part-body[hidden] { display: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: grid; gap: 5px; color: #344054; font-size: .78rem; font-weight: 700; }
    input[type="text"], input[type="url"], textarea, select {
      width: 100%;
      min-height: 40px;
      padding: 9px 11px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      outline: 0;
    }
    textarea { min-height: 104px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(17, 166, 166, .13); }
    .targets { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 2px; }
    .check-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: .72rem; font-weight: 600; }
    .check-pill input { accent-color: var(--cyan); }
    .format-options { display: flex; flex-wrap: wrap; gap: 8px; }
    .format-option { display: inline-flex; align-items: center; gap: 7px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: .78rem; font-weight: 700; }
    .format-option input { accent-color: var(--cyan); }
    .decoration-box { display: grid; gap: 7px; padding: 11px; background: #f8fafc; border: 1px solid var(--line); border-radius: 9px; }
    .decoration-box p { margin: 0; color: var(--muted); font-size: .72rem; }
    .decoration-buttons { display: flex; flex-wrap: wrap; gap: 7px; }
    .decoration-buttons .btn { min-height: 34px; padding: 6px 11px; font-family: Meiryo, sans-serif; }
    .mode-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mode-button { min-height: 42px; }
    .mode-button.active { color: #fff; background: var(--navy-2); border-color: var(--navy-2); }
    .mode-note { margin: 0; color: var(--muted); font-size: .72rem; }
    .color-field { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
    .color-field input[type="color"] { width: 46px; min-height: 40px; padding: 3px; border: 1px solid #cbd3df; border-radius: 8px; background: #fff; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .switch-label { font-size: .78rem; font-weight: 700; }
    .switch { position: relative; display: inline-flex; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { width: 42px; height: 24px; border-radius: 999px; background: #98a2b3; transition: .2s; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .2s; }
    .switch input:checked + span { background: var(--cyan); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .products { display: grid; gap: 10px; }
    .product-row { padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfe; }
    .product-row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: .75rem; font-weight: 800; }
    .product-fields { display: grid; gap: 8px; }
    .output { overflow: hidden; }
    .tabs { display: flex; gap: 4px; padding: 10px 12px 0; overflow-x: auto; border-bottom: 1px solid var(--line); }
    .tab {
      flex: 0 0 auto;
      padding: 9px 11px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-bottom: 3px solid transparent;
      font-size: .78rem;
      font-weight: 700;
    }
    .tab.active { color: var(--navy); border-bottom-color: var(--cyan); }
    .phone-image-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 14px 0;
      padding: 10px 12px;
      color: #405168;
      background: #f3f6fa;
      border: 1px solid #d8e0ea;
      border-radius: 9px;
      font-size: .76rem;
    }
    .phone-image-status strong { flex: 0 0 auto; color: var(--navy); font-size: .82rem; }
    .phone-image-status.limit { color: #765300; background: #fff8df; border-color: #e5bd46; }
    .phone-image-status.limit strong { color: #765300; }
    .phone-image-status.over { color: #9b1c1c; background: #fff0f0; border-color: #e46b6b; }
    .phone-image-status.over strong { color: #9b1c1c; }
    .phone-image-status[hidden] { display: none; }
    .output-tools { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; }
    .output-meta { color: var(--muted); font-size: .72rem; }
    .view-toggle { display: inline-flex; padding: 3px; background: #eaf0f8; border-radius: 8px; }
    .view-toggle button { padding: 6px 10px; color: #536276; background: transparent; border: 0; border-radius: 6px; font-size: .72rem; font-weight: 700; }
    .view-toggle button.active { color: var(--navy); background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    .code-wrap { padding: 0 14px 14px; }
    #codeOutput {
      min-height: 430px;
      margin: 0;
      padding: 16px;
      overflow: auto;
      color: #d7e4f6;
      background: #101b2d;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 13px/1.65 Consolas, "Courier New", monospace;
    }
    .preview-wrap { display: none; padding: 0 14px 14px; }
    .preview-shell { min-height: 430px; padding: 20px; background: #e7ebf1; border-radius: 10px; }
    #previewContent { display: block; width: 100%; min-height: 450px; margin: auto; padding: 18px; overflow-wrap: anywhere; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.12); transition: width .2s; }
    #previewContent img { max-width: 100%; height: auto; }
    #previewContent table { max-width: 100%; border-collapse: collapse; }
    #previewContent a { color: #165da8; pointer-events: none; }
    #previewContent .preview-empty { margin: 0; color: #777; }
    .btn {
      min-height: 38px;
      padding: 8px 13px;
      color: #344054;
      background: #fff;
      border: 1px solid #cbd3df;
      border-radius: 8px;
      font-size: .8rem;
      font-weight: 700;
    }
    .btn:hover, .btn:focus-visible { border-color: var(--navy-2); color: var(--navy); }
    .btn.primary { color: #fff; background: var(--cyan); border-color: var(--cyan); }
    .btn.primary:hover { background: #0b8d8d; }
    .btn.ghost-dark { color: #eaf0f8; background: transparent; border-color: #567095; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 50; padding: 12px 16px; color: #fff; background: #13233b; border-radius: 9px; box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .22s; font-size: .85rem; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .palette, .output { grid-column: auto; }
      .palette-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .topbar { position: static; align-items: flex-start; }
      .brand small { display: none; }
      .layout { display: block; padding: 12px; }
      .panel { margin-bottom: 12px; }
      .palette { position: static; }
      .palette-list { grid-template-columns: 1fr 1fr; }
      .part-add { grid-template-columns: 28px 1fr; padding: 8px; }
      .part-icon { width: 28px; height: 28px; }
      .grid-2 { grid-template-columns: 1fr; }
      .panel-head { align-items: flex-start; }
      .composer-toolbar { flex-wrap: wrap; justify-content: flex-end; }
    }

    /* Workspace base theme */
    :root {
      --ink: #37352f;
      --muted: #787774;
      --line: #e7e6e4;
      --paper: #ffffff;
      --wash: #fbfbfa;
      --navy: #37352f;
      --navy-2: #2f2e2b;
      --cyan: #2383e2;
      --cyan-soft: #eef6fd;
      --danger: #eb5757;
      --shadow: 0 1px 2px rgba(15, 15, 15, .04);
      --radius: 7px;
    }
    body {
      color: var(--ink);
      background: var(--wash);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.5;
    }
    .topbar {
      min-height: 56px;
      padding: 8px clamp(16px, 3vw, 36px);
      color: var(--ink);
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      backdrop-filter: blur(12px);
    }
    .brand { gap: 10px; }
    .brand-mark {
      width: 34px;
      height: 34px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: .72rem;
      letter-spacing: -.08em;
      box-shadow: var(--shadow);
    }
    .brand h1 { font-size: .96rem; font-weight: 650; letter-spacing: -.01em; }
    .brand small { margin-top: 1px; color: var(--muted); font-size: .75rem; }
    .layout {
      grid-template-columns: minmax(380px, 1fr) minmax(440px, 1fr);
      gap: 16px;
      width: min(1500px, 100%);
      padding: 24px clamp(16px, 3vw, 36px) 48px;
    }
    .panel {
      background: var(--paper);
      border-color: var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel-head { padding: 13px 15px; }
    .panel-head h2 { font-size: .94rem; font-weight: 650; letter-spacing: -.01em; }
    .panel-head p { margin-top: 1px; font-size: .75rem; }
    .palette-list {
      grid-template-columns: repeat(7, minmax(130px, 1fr));
      gap: 6px;
      padding: 10px 12px 12px;
    }
    .part-add {
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
      border-color: transparent;
      border-radius: 5px;
      box-shadow: none;
    }
    .part-add:hover, .part-add:focus-visible {
      color: var(--ink);
      background: #f1f1ef;
      border-color: transparent;
      transform: none;
    }
    .part-icon {
      width: 28px;
      height: 28px;
      color: #56534e;
      background: #f1f1ef;
      border-radius: 4px;
      font-size: .8rem;
    }
    .part-add strong { overflow: hidden; font-size: .82rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .part-add small { overflow: hidden; font-size: .68rem; text-overflow: ellipsis; white-space: nowrap; }
    .rule-note {
      margin: 0 12px 12px;
      padding: 10px 12px;
      color: #5f5e5a;
      background: #f7f7f5;
      border-left: 3px solid #c8c7c4;
      border-radius: 3px;
      font-size: .76rem;
    }
    .parts { gap: 9px; padding: 12px; }
    .empty {
      padding: 48px 18px;
      background: #fff;
      border-color: #d9d8d6;
      border-radius: 5px;
      font-size: .86rem;
    }
    .empty::before { content: "+"; display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 10px; color: #9b9a97; background: #f1f1ef; border-radius: 5px; font-size: 1.15rem; }
    .empty strong { font-size: .92rem; font-weight: 600; }
    .part-card { border-color: var(--line); border-radius: 6px; box-shadow: none; }
    .part-card:hover { border-color: #d3d2cf; }
    .part-card.drag-over { outline-color: rgba(35, 131, 226, .55); }
    .part-card-head { min-height: 48px; padding: 7px 9px; background: #fff; border-bottom-color: var(--line); }
    .drag-handle { color: #b4b4b1; }
    .part-title { font-size: .88rem; font-weight: 600; }
    .number { color: #9b9a97; font-size: .7rem; }
    .status-badge { padding: 3px 7px; border-radius: 4px; font-size: .68rem; font-weight: 600; }
    .status-badge.on { color: #448361; background: #edf3ec; }
    .status-badge.off { color: #c4554d; background: #faecec; }
    .icon-btn { border-radius: 4px; }
    .icon-btn:hover, .icon-btn:focus-visible { color: var(--ink); background: #f1f1ef; }
    .part-body { gap: 13px; padding: 14px 13px 16px; background: #fbfbfa; }
    label, .switch-label { color: #5f5e5a; font-size: .82rem; font-weight: 600; }
    input[type="text"], input[type="url"], textarea, select {
      min-height: 38px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
      border-color: #d9d8d6;
      border-radius: 4px;
      box-shadow: 0 1px 1px rgba(15, 15, 15, .03);
    }
    input:hover, textarea:hover, select:hover { border-color: #c8c7c4; }
    input:focus, textarea:focus, select:focus { border-color: #2383e2; box-shadow: 0 0 0 2px rgba(35, 131, 226, .18); }

      color: #5f5e5a;
      background: #fff;
      border-color: #d9d8d6;
      border-radius: 4px;
      font-weight: 500;
    }

    .check-pill input, .format-option input { accent-color: #2383e2; }
    .decoration-box, .product-row { background: #fff; border-color: #e1e0de; border-radius: 5px; }
    .decoration-box p, .mode-note { font-size: .75rem; }
    .color-field input[type="color"] { border-color: #d9d8d6; border-radius: 4px; }
    .switch-row { border-top-color: #deddd9; }
    .switch span { background: #c8c7c4; }
    .switch input:checked + span { background: #2383e2; }
    .tabs { gap: 2px; padding: 7px 9px 0; }
    .tab { padding: 8px 10px; color: #787774; border-bottom-width: 2px; font-size: .78rem; font-weight: 550; }
    .tab:hover { color: var(--ink); background: #f7f7f5; }
    .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
    .phone-image-status { margin: 10px 12px 0; padding: 9px 11px; color: #5f5e5a; background: #f7f7f5; border-color: #e1e0de; border-radius: 4px; }
    .phone-image-status strong { color: var(--ink); }
    .output-tools { padding: 10px 12px; }
    .view-toggle { padding: 2px; background: #f1f1ef; border-radius: 5px; }
    .view-toggle button { border-radius: 3px; font-weight: 550; }
    .view-toggle button.active { color: var(--ink); box-shadow: 0 1px 2px rgba(15, 15, 15, .12); }
    .code-wrap, .preview-wrap { padding: 0 12px 12px; }
    #codeOutput { color: #eeeeec; background: #252525; border-radius: 5px; }
    .preview-shell { background: #f1f1ef; border-radius: 5px; }
    #previewContent { box-shadow: 0 1px 4px rgba(15, 15, 15, .1); }
    .btn {
      min-height: 34px;
      padding: 6px 10px;
      color: #5f5e5a;
      background: #fff;
      border-color: #d9d8d6;
      border-radius: 5px;
      font-size: .78rem;
      font-weight: 550;
      box-shadow: 0 1px 1px rgba(15, 15, 15, .04);
    }
    .btn:hover, .btn:focus-visible { color: var(--ink); background: #f7f7f5; border-color: #c8c7c4; }
    .btn.primary { color: #fff; background: #37352f; border-color: #37352f; }
    .btn.primary:hover { color: #fff; background: #2f2e2b; border-color: #2f2e2b; }
    .btn.ghost-dark { color: #5f5e5a; background: #fff; border-color: #d9d8d6; }
    .btn.ghost-dark:hover { color: #c4554d; background: #faecec; border-color: #e8b7b4; }
    .mode-button.active { color: #fff; background: #37352f; border-color: #37352f; }
    .toast { color: #fff; background: #37352f; border-radius: 5px; box-shadow: 0 4px 16px rgba(15, 15, 15, .16); }
    @media (max-width: 1180px) {
      .palette-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      ];

      const DEFINITIONS = {
        heading: { label: '見出し', icon: 'H', hint: '色・サイズ・配置を指定', defaults: { text: '商品の特徴', fontSize: '5', alignment: 'center', backgroundColor: '#f7f7f7', textColor: '#172033', bold: true, targets: ['pcDescription', 'phoneDescription'] } },
        text: { label: '文章', icon: '文', hint: '装飾を組み合わせて指定', defaults: { text: '', bold: false, red: false, center: false, targets: ['pcDescription', 'phoneDescription'] } },
        image: { label: '画像', icon: '画', hint: '画像1枚・リンク対応', defaults: { section: '商品画像', src: '', alt: '', href: '', targets: ['phoneDescription', 'pcSales'] } },
        imageGroup: { label: '画像グループ', icon: '複', hint: '複数画像をまとめて追加', defaults: { section: 'デザイン', urls: '', targets: ['phoneDescription', 'pcSales'] } },
        rawHtml: { label: 'HTMLを直接入力', icon: '&lt;&gt;', hint: '既存コードをそのまま貼り付け', defaults: { html: '', widthMode: 'auto', targets: ['pcDescription', 'phoneDescription', 'pcSales'] } },
        related: { label: 'おすすめ商品', icon: '推', hint: '1〜3列の商品カード', defaults: { title: 'こちらの商品もおすすめ', columns: '2', headingBackground: '#f7f7f7', headingColor: '#172033', priceColor: '#bf0000', products: [{ name: '', price: '', image: '', url: '' }, { name: '', price: '', image: '', url: '' }], targets: ['pcDescription', 'phoneDescription'] } },
        divider: { label: '区切り線', icon: '―', hint: '内容の区切り', defaults: { targets: ['pcDescription', 'phoneDescription'] } }
      };

      let parts = [];
      let activeOutput = OUTPUTS[0].id;
      let activeView = 'preview';
      let draggedId = null;

      const el = id => document.getElementById(id);
      const clone = value => JSON.parse(JSON.stringify(value));
      const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
      const escapeAttr = escapeHtml;
      const lines = value => escapeHtml(value).replace(/\r?\n/g, '<br>');
      const byId = id => parts.find(part => part.id === id);

      function showToast(message) {
        const toast = el('toast');
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function createPart(type, overrides = {}) {
        const def = DEFINITIONS[type];
        return { id: uid(), type, enabled: true, collapsed: false, ...clone(def.defaults), ...clone(overrides) };
      }

      function renderPalette() {
        el('paletteList').innerHTML = Object.entries(DEFINITIONS).map(([type, def]) => `
          <button class="part-add" type="button" data-add="${type}">
            <span class="part-icon" aria-hidden="true">${def.icon}</span>
            <span><strong>${def.label}</strong><small>${def.hint}</small></span>
          </button>`).join('');
      }

      function targetControls(part) {
        return `<div><span class="sr-only">出力先</span><div class="targets">${OUTPUTS.map(output => `
          <label class="check-pill"><input type="checkbox" data-field="targets" value="${output.id}" ${part.targets.includes(output.id) ? 'checked' : ''}>${output.label}</label>`).join('')}</div></div>`;
      }

      function field(label, key, value, type = 'text', placeholder = '') {
        return `<label>${label}<input type="${type}" data-field="${key}" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}"></label>`;
      }

      function textarea(label, key, value, placeholder = '') {
        return `<label>${label}<textarea data-field="${key}" placeholder="${escapeAttr(placeholder)}">${escapeHtml(value)}</textarea></label>`;
      }

      function colorField(label, key, value) {
        return `<label>${label}<span class="color-field"><input type="color" data-field="${key}" data-color-pair value="${escapeAttr(value)}" aria-label="${label}をカラーパレットで選ぶ"><input type="text" data-field="${key}" data-color-pair value="${escapeAttr(value)}" maxlength="7" placeholder="#000000" aria-label="${label}をカラーコードで入力"></span></label>`;
      }

      function checkOption(label, key, checked) {
        return `<label class="format-option"><input type="checkbox" data-field="${key}" ${checked ? 'checked' : ''}>${label}</label>`;
      }

      function productFields(part) {
        return `<div class="products">${part.products.map((product, index) => `
          <div class="product-row">
            <div class="product-row-head"><span>商品 ${index + 1}</span><button class="icon-btn delete" type="button" data-remove-product="${index}" aria-label="商品${index + 1}を削除">削除</button></div>
            <div class="product-fields">
              <div class="grid-2">${field('商品名', `products.${index}.name`, product.name, 'text', '商品名')}${field('価格・補足', `products.${index}.price`, product.price, 'text', '1,980円〜')}</div>
              ${field('画像URL', `products.${index}.image`, product.image, 'url', 'https://...')}
              ${field('商品ページURL', `products.${index}.url`, product.url, 'url', 'https://...')}
            </div>
          </div>`).join('')}<button class="btn" type="button" data-add-product>＋ 商品を追加</button></div>`;
      }

      function bodyFor(part) {
        if (part.type === 'heading') return `${field('見出し', 'text', part.text)}<div class="grid-2"><label>文字サイズ<select data-field="fontSize"><option value="3" ${part.fontSize === '3' ? 'selected' : ''}>小</option><option value="4" ${part.fontSize === '4' ? 'selected' : ''}>やや小</option><option value="5" ${part.fontSize === '5' ? 'selected' : ''}>標準</option></select></label><label>文字の配置<select data-field="alignment"><option value="left" ${part.alignment === 'left' ? 'selected' : ''}>左寄せ</option><option value="center" ${part.alignment === 'center' ? 'selected' : ''}>中央寄せ</option><option value="right" ${part.alignment === 'right' ? 'selected' : ''}>右寄せ</option></select></label></div><div class="grid-2">${colorField('背景色', 'backgroundColor', part.backgroundColor)}${colorField('文字色', 'textColor', part.textColor)}</div><div class="format-options">${checkOption('太字', 'bold', part.bold)}</div>`;
        if (part.type === 'text') return `${textarea('文章', 'text', part.text, '改行もそのまま反映されます')}<div class="decoration-box"><span class="switch-label">文字を囲む装飾</span><p>ボタンを押すとカーソル位置にひな形が入り、「テキスト」部分をそのまま打ち換えられます。</p><div class="decoration-buttons"><button class="btn" type="button" data-wrap-start="＼" data-wrap-end="／">＼テキスト／</button><button class="btn" type="button" data-wrap-start="【" data-wrap-end="】">【テキスト】</button><button class="btn" type="button" data-wrap-start="▼" data-wrap-end="▼">▼テキスト▼</button><button class="btn" type="button" data-wrap-start="▲" data-wrap-end="▲">▲テキスト▲</button><button class="btn" type="button" data-wrap-start="★" data-wrap-end="★">★テキスト★</button><button class="btn" type="button" data-wrap-start="■" data-wrap-end="■">■テキスト■</button><button class="btn" type="button" data-wrap-start="●" data-wrap-end="●">●テキスト●</button><button class="btn" type="button" data-wrap-start="◆" data-wrap-end="◆">◆テキスト◆</button></div></div><div><span class="switch-label">文字の装飾・配置</span><div class="format-options" style="margin-top:6px">${checkOption('太字', 'bold', part.bold)}${checkOption('赤字', 'red', part.red)}${checkOption('中央寄せ', 'center', part.center)}</div></div>`;
        if (part.type === 'image') return `${field('セクション名', 'section', part.section)}${field('画像URL', 'src', part.src, 'url', 'https://...')}${field('代替テキスト', 'alt', part.alt, 'text', '画像の内容')}${field('リンクURL（任意）', 'href', part.href, 'url', 'https://...')}`;
        if (part.type === 'imageGroup') return `${field('セクション名', 'section', part.section)}${textarea('画像URL（1行に1つ）', 'urls', part.urls, 'https://.../image01.jpg\nhttps://.../image02.jpg')}`;
        if (part.type === 'rawHtml') return `${textarea('HTML', 'html', part.html, '<img src="https://.../image.jpg" width="500">')}<div><span class="switch-label">画像幅の処理</span><div class="mode-buttons" style="margin-top:6px"><button class="btn mode-button ${part.widthMode === 'auto' ? 'active' : ''}" type="button" data-width-mode="auto" aria-pressed="${part.widthMode === 'auto'}">画像幅を自動調整</button><button class="btn mode-button ${part.widthMode === 'keep' ? 'active' : ''}" type="button" data-width-mode="keep" aria-pressed="${part.widthMode === 'keep'}">そのままにする</button></div></div><p class="mode-note">自動調整では、PC用を700px、スマートフォン用を100%にします。</p>`;
        if (part.type === 'related') return `${field('見出し', 'title', part.title)}<label>列数<select data-field="columns"><option value="1" ${part.columns === '1' ? 'selected' : ''}>1列</option><option value="2" ${part.columns === '2' ? 'selected' : ''}>2列</option><option value="3" ${part.columns === '3' ? 'selected' : ''}>3列</option></select></label><div class="grid-2">${colorField('見出しの背景色', 'headingBackground', part.headingBackground)}${colorField('見出しの文字色', 'headingColor', part.headingColor)}</div>${colorField('価格・補足の色', 'priceColor', part.priceColor)}${productFields(part)}`;
        return '<p style="margin:0;color:#667085;font-size:.78rem">設定項目はありません。</p>';
      }

      function renderParts() {
        const list = el('partsList');
        if (!parts.length) {
          list.innerHTML = '<div class="empty"><strong>パーツはまだありません</strong>上の一覧から追加してください。</div>';
          updateOutput();
          return;
        }
        list.innerHTML = parts.map((part, index) => {
          const def = DEFINITIONS[part.type];
          return `<article class="part-card" data-id="${part.id}">
            <div class="part-card-head">
              <span class="drag-handle" draggable="true" title="ここをドラッグして並べ替え" aria-label="ドラッグして並べ替え">⋮⋮</span>
              <span class="number">${String(index + 1).padStart(2, '0')}</span>
              <span class="part-title">${def.label}</span>
              <span class="status-badge ${part.enabled ? 'on' : 'off'}">${part.enabled ? '表示中' : '非表示'}</span>
              <button class="icon-btn" type="button" data-move="up" aria-label="上へ移動">↑</button>
              <button class="icon-btn" type="button" data-move="down" aria-label="下へ移動">↓</button>
              <button class="icon-btn" type="button" data-collapse aria-label="${part.collapsed ? '設定を開く' : '設定を閉じる'}">${part.collapsed ? '開く' : '閉じる'}</button>
              <button class="icon-btn delete" type="button" data-delete aria-label="削除">削除</button>
            </div>
            <div class="part-body" ${part.collapsed ? 'hidden' : ''}>
              ${bodyFor(part)}
              ${targetControls(part)}
              <div class="switch-row"><span class="switch-label">このパーツを表示</span><label class="switch"><input type="checkbox" data-field="enabled" ${part.enabled ? 'checked' : ''}><span></span></label></div>
            </div>
          </article>`;
        }).join('');
        updateOutput();
      }

      function renderTabs() {
        el('outputTabs').innerHTML = OUTPUTS.map(output => `<button class="tab ${output.id === activeOutput ? 'active' : ''}" type="button" role="tab" aria-selected="${output.id === activeOutput}" data-output="${output.id}">${output.label}</button>`).join('');
      }

      function imageWidth(output) {
        if (output === 'phoneDescription') return '100%';
        if (output === 'pcSales') return '700px';
        return '100%';
      }

      function commentLabel(value, fallback) {
        const cleaned = String(value || fallback).replace(/--/g, '—').trim();
        return escapeHtml(cleaned);
      }

      function wrapSection(label, html) {
        const safeLabel = commentLabel(label, 'パーツ');
        return `<!-- ▼ ${safeLabel} ▼ -->\n${html}\n<!-- ▲ ${safeLabel} ▲ -->`;
      }

      function imgTag(src, alt, output) {
        if (!String(src).trim()) return '';
        return `<img src="${escapeAttr(String(src).trim())}" width="${imageWidth(output)}" alt="${escapeAttr(alt || '')}" border="0">`;
      }

      function adjustRawImageWidths(html, output) {
        const width = output === 'phoneDescription' ? '100%' : '700px';
        return String(html).replace(/<img\b[^>]*>/gi, tag => {
          const widthAttribute = /(\s)width\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/i;
          if (widthAttribute.test(tag)) return tag.replace(widthAttribute, `$1width="${width}"`);
          return tag.replace(/\s*(\/?)>$/, ` width="${width}"$1>`);
        });
      }

      function generateRelated(part, output) {
        const products = part.products.filter(product => product.image || product.name || product.price || product.url);
        if (!products.length) return '';
        const columns = Math.max(1, Math.min(3, Number(part.columns) || 2));
        const width = Math.floor(100 / columns) + '%';
        const cells = products.map(product => {
          let image = imgTag(product.image, product.name, output);
          if (product.url && image) image = `<a href="${escapeAttr(product.url)}" target="_blank">${image}</a>`;
          const name = product.name ? `<br><b>${escapeHtml(product.name)}</b>` : '';
          const price = product.price ? `<br><font color="${escapeAttr(part.priceColor)}"><b>${escapeHtml(product.price)}</b></font>` : '';
          return `<td width="${width}" align="center">${image}${name}${price}<br><br></td>`;
        });
        const rows = [];
        for (let i = 0; i < cells.length; i += columns) rows.push(`  <tr>\n    ${cells.slice(i, i + columns).join('\n    ')}\n  </tr>`);
        const heading = `<table width="100%" cellpadding="10"><tr><th bgcolor="${escapeAttr(part.headingBackground)}" height="40"><font size="3" color="${escapeAttr(part.headingColor)}">${escapeHtml(part.title)}</font></th></tr></table>`;
        const table = `<table cellpadding="10" align="center" width="100%">\n${rows.join('\n')}\n</table>`;
        return wrapSection(part.title, `${heading}\n${table}`);
      }

      function generatePart(part, output) {
        let html = '';
        if (part.type === 'heading' && part.text) {
          const content = part.bold ? `<b>${escapeHtml(part.text)}</b>` : escapeHtml(part.text);
          const alignment = ['left', 'center', 'right'].includes(part.alignment) ? part.alignment : 'center';
          const heading = `<table width="100%" cellpadding="10"><tr><td bgcolor="${escapeAttr(part.backgroundColor)}" align="${alignment}"><font size="${escapeAttr(part.fontSize)}" color="${escapeAttr(part.textColor)}">${content}</font></td></tr></table>`;
          html = wrapSection(part.text, `${heading}<br><br>`);
        } else if (part.type === 'text' && part.text) {
          let styled = lines(part.text);
          if (part.bold) styled = `<b>${styled}</b>`;
          if (part.red) styled = `<font color="#bf0000">${styled}</font>`;
          if (part.center) styled = `<center>${styled}</center>`;
          html = wrapSection('文章', `${styled}<br><br>`);
        } else if (part.type === 'image' && part.src) {
          let image = imgTag(part.src, part.alt, output);
          if (part.href) image = `<a href="${escapeAttr(part.href)}" target="_blank">${image}</a>`;
          html = wrapSection(part.section, `${image}<br><br>`);
        } else if (part.type === 'imageGroup') {
          const images = String(part.urls).split(/\r?\n/).map(url => url.trim()).filter(Boolean).map(url => `${imgTag(url, part.section, output)}<br><br>`).join('\n');
          if (images) html = wrapSection(part.section, images);
        } else if (part.type === 'rawHtml' && part.html.trim()) {
          html = part.widthMode === 'keep' ? part.html : adjustRawImageWidths(part.html, output);
        } else if (part.type === 'related') {
          html = generateRelated(part, output);
        } else if (part.type === 'divider') {
          html = '<hr>';
        }
        if (!html) return '';
        return part.enabled ? html : `<!-- 非表示\n${html.replace(/<!--/g, '<!—').replace(/-->/g, '—>')}\n非表示ここまで -->`;
      }

      function generate(output) {
        return parts.filter(part => part.targets.includes(output)).map(part => generatePart(part, output)).filter(Boolean).join('\n\n');
      }

      function countVisibleImages(html) {
        const template = document.createElement('template');
        template.innerHTML = html;
        return [...template.content.querySelectorAll('img')].filter(image => {
          if (!(image.getAttribute('src') || '').trim()) return false;
          const isZero = value => /^0(?:px|%)?$/.test(String(value || '').trim().toLowerCase());
          if (isZero(image.getAttribute('width')) || isZero(image.getAttribute('height'))) return false;
          let node = image;
          while (node && node.getAttribute) {
            if (node.hasAttribute('hidden') || node.getAttribute('aria-hidden') === 'true') return false;
            const style = (node.getAttribute('style') || '').replace(/\s+/g, '').toLowerCase();
            if (style.includes('display:none') || style.includes('visibility:hidden') || style.includes('opacity:0')) return false;
            node = node.parentElement;
          }
          return true;
        }).length;
      }

      function updatePhoneImageStatus() {
        const status = el('phoneImageStatus');
        const count = countVisibleImages(generate('phoneDescription'));
        status.classList.remove('limit', 'over');
        el('phoneImageCount').textContent = `${count} / 18枚`;
        if (count > 18) {
          status.classList.add('over');
          el('phoneImageMessage').textContent = `上限を${count - 18}枚超えています。表示する画像を減らしてください。`;
        } else if (count === 18) {
          status.classList.add('limit');
          el('phoneImageMessage').textContent = '利用可能な上限です。これ以上表示すると制限を超えます。';
        } else {
          el('phoneImageMessage').textContent = `あと${18 - count}枚表示できます。`;
        }
      }

      function safePreviewHtml(html) {
        const template = document.createElement('template');
        template.innerHTML = html;
        template.content.querySelectorAll('script, iframe, object, embed, link, meta, style, form, input, button, textarea, select').forEach(node => node.remove());
        template.content.querySelectorAll('*').forEach(node => {
          [...node.attributes].forEach(attribute => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim().toLowerCase();
            if (name.startsWith('on') || name === 'srcdoc' || name === 'style' || ((name === 'href' || name === 'src') && value.startsWith('javascript:'))) node.removeAttribute(attribute.name);
          });
        });
        return template.innerHTML;
      }

      function updateOutput() {
        const html = generate(activeOutput);
        el('codeOutput').textContent = html || '<!-- パーツを追加すると、ここにHTMLが表示されます -->';
        el('outputMeta').textContent = `${html.length.toLocaleString()}文字・${parts.filter(part => part.targets.includes(activeOutput)).length}パーツ`;
        const preview = el('previewContent');
        preview.style.width = activeOutput === 'phoneDescription' ? '390px' : '100%';
        preview.innerHTML = html ? safePreviewHtml(html) : '<p class="preview-empty">表示できる内容はまだありません。</p>';
        updatePhoneImageStatus();
      }

      function setNested(part, path, value) {
        const keys = path.split('.');
        let target = part;
        for (let i = 0; i < keys.length - 1; i++) target = target[keys[i]];
        target[keys[keys.length - 1]] = value;
      }

      function movePart(id, direction) {
        const index = parts.findIndex(part => part.id === id);
        const next = direction === 'up' ? index - 1 : index + 1;
        if (index < 0 || next < 0 || next >= parts.length) return;
        [parts[index], parts[next]] = [parts[next], parts[index]];
        renderParts();
      }

      el('paletteList').addEventListener('click', event => {
        const button = event.target.closest('[data-add]');
        if (!button) return;
        parts.push(createPart(button.dataset.add));
        renderParts();
        const card = el('partsList').lastElementChild;
        card?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });

      el('partsList').addEventListener('click', event => {
        const card = event.target.closest('.part-card');
        if (!card) return;
        const part = byId(card.dataset.id);
        const widthMode = event.target.closest('[data-width-mode]');
        if (widthMode && part.type === 'rawHtml') {
          part.widthMode = widthMode.dataset.widthMode;
          renderParts();
          return;
        }
        const wrap = event.target.closest('[data-wrap-start]');
        if (wrap && part.type === 'text') {
          const area = card.querySelector('textarea[data-field="text"]');
          const start = area.selectionStart;
          const end = area.selectionEnd;
          const placeholder = 'テキスト';
          const inserted = `${wrap.dataset.wrapStart}${placeholder}${wrap.dataset.wrapEnd}`;
          part.text = area.value.slice(0, start) + inserted + area.value.slice(end);
          area.value = part.text;
          area.focus();
          const selectionStart = start + wrap.dataset.wrapStart.length;
          area.setSelectionRange(selectionStart, selectionStart + placeholder.length);
          updateOutput();
          return;
        }
        if (event.target.closest('[data-delete]')) { parts = parts.filter(item => item.id !== part.id); renderParts(); return; }
        if (event.target.closest('[data-collapse]')) { part.collapsed = !part.collapsed; renderParts(); return; }
        const move = event.target.closest('[data-move]');
        if (move) { movePart(part.id, move.dataset.move); return; }
        const addProduct = event.target.closest('[data-add-product]');
        if (addProduct) { part.products.push({ name: '', price: '', image: '', url: '' }); renderParts(); return; }
        const removeProduct = event.target.closest('[data-remove-product]');
        if (removeProduct) { part.products.splice(Number(removeProduct.dataset.removeProduct), 1); renderParts(); }
      });

      el('partsList').addEventListener('input', event => {
        const input = event.target.closest('[data-field]');
        const card = event.target.closest('.part-card');
        if (!input || !card) return;
        const part = byId(card.dataset.id);
        if (input.dataset.field === 'targets') {
          part.targets = [...card.querySelectorAll('[data-field="targets"]:checked')].map(box => box.value);
        } else if (input.dataset.field === 'enabled') {
          part.enabled = input.checked;
        } else {
          const value = input.type === 'checkbox' ? input.checked : input.value;
          setNested(part, input.dataset.field, value);
          if (input.hasAttribute('data-color-pair') && (/^#[0-9a-f]{6}$/i.test(value))) {
            card.querySelectorAll(`[data-field="${input.dataset.field}"][data-color-pair]`).forEach(control => { if (control !== input) control.value = value; });
          }
        }
        updateOutput();
      });

      el('partsList').addEventListener('dragstart', event => {
        const handle = event.target.closest('.drag-handle');
        const card = handle?.closest('.part-card');
        if (!handle || !card) { event.preventDefault(); return; }
        draggedId = card.dataset.id;
        card.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
      });
      el('partsList').addEventListener('dragover', event => { const card = event.target.closest('.part-card'); if (card && card.dataset.id !== draggedId) { event.preventDefault(); card.classList.add('drag-over'); } });
      el('partsList').addEventListener('dragleave', event => event.target.closest('.part-card')?.classList.remove('drag-over'));
      el('partsList').addEventListener('drop', event => {
        const card = event.target.closest('.part-card');
        if (!card || card.dataset.id === draggedId) return;
        event.preventDefault();
        const from = parts.findIndex(part => part.id === draggedId);
        const to = parts.findIndex(part => part.id === card.dataset.id);
        const [moved] = parts.splice(from, 1);
        parts.splice(to, 0, moved);
        renderParts();
      });
      el('partsList').addEventListener('dragend', () => { draggedId = null; renderParts(); });

      el('outputTabs').addEventListener('click', event => {
        const tab = event.target.closest('[data-output]');
        if (!tab) return;
        activeOutput = tab.dataset.output;
        renderTabs();
        updateOutput();
      });

      document.querySelector('.view-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-view]');
        if (!button) return;
        activeView = button.dataset.view;
        document.querySelectorAll('.view-toggle button').forEach(item => item.classList.toggle('active', item === button));
        el('codeWrap').style.display = activeView === 'code' ? 'block' : 'none';
        el('previewWrap').style.display = activeView === 'preview' ? 'block' : 'none';
        updateOutput();
      });

      el('copyBtn').addEventListener('click', async () => {
        const html = generate(activeOutput);
        if (!html) { showToast('コピーするHTMLがありません'); return; }
        try {
          await navigator.clipboard.writeText(html);
          showToast('HTMLをコピーしました');
        } catch (_) {
          const area = document.createElement('textarea');
          area.value = html;
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
          showToast('HTMLをコピーしました');
        }
      });

      el('clearBtn').addEventListener('click', () => { if (parts.length && !window.confirm('すべてのパーツを削除しますか？')) return; parts = []; renderParts(); showToast('クリアしました'); });
      el('expandBtn').addEventListener('click', () => { parts.forEach(part => { part.collapsed = false; }); renderParts(); });
      el('collapseBtn').addEventListener('click', () => { parts.forEach(part => { part.collapsed = true; }); renderParts(); });
      el('showAllBtn').addEventListener('click', () => { parts.forEach(part => { part.enabled = true; }); renderParts(); showToast('すべてのパーツを表示しました'); });
      el('hideAllBtn').addEventListener('click', () => { parts.forEach(part => { part.enabled = false; }); renderParts(); showToast('すべてのパーツを非表示にしました'); });

      renderPalette();
      renderTabs();
      renderParts();
    })();
  </script>
</body>
</html>
